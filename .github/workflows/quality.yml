name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-and-build:
    name: Regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression checks
        run: |
          npm run check:photo-navigation-persistence
          npm run check:job-photo-persistence
          npm run check:legacy-damage-map-photos
          npm run check:damage-map-image-required
          npm run check:job-detail-module-boundaries
          npm run check:work-log-draft-safety
          npm run check:inventory-module-boundaries
          npm run check:permissions
          npm run check:backup-restore-snapshot-safety

      - name: Build production bundle
        run: npm run build

  local-database-and-browser:
    name: Local database and browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Start local Supabase
        run: supabase start

      - name: Configure the local app backend
        shell: bash
        run: |
          eval "$(supabase status --output env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } > .env.local

      - name: Run pgTAP and RLS tests
        run: npm run test:db

      - name: Seed isolated browser fixtures
        run: |
          npm run test:e2e:seed
          node scripts/seed-local-test-shops.mjs --no-report

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
